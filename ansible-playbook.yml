- name: Configure Docker and deploy app on EC2
  hosts: all
  become: true
  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Remove conflicting containerd packages (ignore errors if not installed)
      apt:
        name: "{{ item }}"
        state: absent
        purge: yes
        autoremove: yes
      loop:
        - containerd
        - containerd.io
      ignore_errors: yes

    - name: Install prerequisites for Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker Engine
      apt:
        name: docker-ce
        state: present


    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Deploy Docker container
      docker_container:
        name: insure-me
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        published_ports:
          - "8084:8081"
